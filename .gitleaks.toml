# Gitleaks Configuration for Copra Protocol
# https://github.com/gitleaks/gitleaks

title = "Copra Protocol Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for Solidity contract names and library keywords"
regexes = [
    '''ERC20Burnable''',
    '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
    # Public 20-byte EVM addresses (contract/token addresses trip generic-api-key next to names like
    # `token`). MUST stay anchored: a 32-byte private key begins with 40 hex chars, so an unanchored
    # pattern would allowlist real keys. One rule here means a redeploy needs no allowlist edit.
    '''^0x[0-9a-fA-F]{40}$''',
]
paths = [
    '''lib/.*''',
    '''cache/.*''',
    '''out/.*''',
    '''broadcast/.*''',
    '''deployments/.*''',
    '''\.gitleaks\.toml''',
]
