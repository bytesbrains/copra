[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned: CopraRegistry lives at a CREATE2 address derived from its bytecode, so the compiler must not drift.
solc_version = "0.8.28"
# No source metadata in bytecode, so formatting/comment edits do not move the CREATE2 address.
bytecode_hash = "none"
cbor_metadata = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
