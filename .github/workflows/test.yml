name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run web quote tests
        run: node --test test/web/*.test.cjs

      - name: Run CI workflow script tests
        run: node --test test/ci/*.test.cjs

      - name: Run oracle feeder source tests
        run: python3 -m unittest discover -s test/feeder -v

      - name: Run GCPI source registry tests
        run: python3 -m unittest discover -s test/gcpi -v

      - name: Simulate deployment script (dry-run)
        env:
          # A local simulation needs no real key, and this job runs code from any pushed branch.
          PRIVATE_KEY: '1'
        run: forge script script/DeployCopra.s.sol:DeployCopra

  # The pre-push hook's committed-files check, enforced: hooks are opt-in and --no-verify skips them.
  # Every commit the PR adds, not just its final tree, since a deleted file stays in history.
  committed-files:
    name: Committed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: No local state, ignored, unexpected binary or oversized files in the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-committed-files.sh "${BASE_SHA}..HEAD"

  e2e-stack:
    name: E2E stack (local chain)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # Brings up anvil (chain id 84532, 2s blocks), deploys as production does with the registry at its
      # canonical address, serves the dApp built for the local network with wrangler dev, verifies the
      # deployment through the registry and the served dApp against it, runs the contract scenario suite
      # (real transactions, invariants after each one), the oracle feeder scenarios (the real feeder,
      # resolving the oracle through the registry) and the tier-1 browser suite (real Chrome against the
      # served dApp, every transaction real), and tears everything down.
      - name: Deploy to a throwaway chain, verify it and the served dApp, run contract, feeder and browser suites
        run: make e2e

      # The manifest always; on failure also the browser suite's traces, screenshots and videos
      # (e2e/.out/browser) and the chain and web logs (e2e/.out/stack.log).
      - name: Upload deployment manifest and failure artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output
          path: e2e/.out/
          include-hidden-files: true # e2e/.out is a dot-directory, skipped by default
          if-no-files-found: warn
