name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run web quote tests
        run: node --test test/web/*.test.cjs

      - name: Run oracle feeder tests (local anvil)
        run: ./test/feeder/oracle-feeder.test.sh

      - name: Simulate deployment script (dry-run)
        env:
          # A local simulation needs no real key, and this job runs code from any pushed branch.
          PRIVATE_KEY: '1'
        run: forge script script/DeployCopra.s.sol:DeployCopra

  e2e-stack:
    name: E2E stack (local chain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # Brings up anvil (chain id 84532, 2s blocks), deploys as production does with the registry at its
      # canonical address, verifies the deployment through the registry, runs the contract scenario suite
      # (real transactions, invariants after each one), and tears everything down.
      - name: Deploy to a throwaway chain, verify, run contract scenarios
        run: make e2e

      - name: Upload deployment manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-deployment-manifest
          path: e2e/.out/
          include-hidden-files: true # e2e/.out is a dot-directory, skipped by default
          if-no-files-found: warn
