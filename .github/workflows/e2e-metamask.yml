name: E2E with real MetaMask

# Tier 2 (#50): the pinned MetaMask extension in Playwright's Chromium against the e2e stack, every
# approval clicked in MetaMask's own UI. Nightly, by hand, and on PRs that change the browser harness or
# the dApp. The release workflow calls it on the release commit and refuses to publish unless it is green.
on:
  schedule:
    - cron: '0 4 * * *' # nightly, 04:00 UTC
  pull_request:
    paths:
      - 'e2e/browser/**'
      - 'e2e/docker-compose.yml'
      - 'web/**'
      - '.github/workflows/e2e-metamask.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-metamask-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  metamask:
    name: Tier 2 (real MetaMask)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # The stack as tier 1 uses it (anvil, the real deploy, the dApp served by wrangler dev), then the
      # tier-2 suite in the browser image plus the pinned MetaMask. Always torn down.
      - name: Bring up the stack and run the tier-2 suite
        run: |
          status=0
          make e2e-up && make e2e-metamask || status=$?
          [ "$status" -eq 0 ] || docker compose -f e2e/docker-compose.yml logs --no-color --timestamps chain web > e2e/.out/stack.log 2>&1
          make e2e-down
          exit "$status"

      # The report and MetaMask's version; on failure each test's video and screenshots of every page,
      # MetaMask's side panel included.
      - name: Upload tier-2 output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-metamask
          path: e2e/.out/
          include-hidden-files: true
          if-no-files-found: warn
