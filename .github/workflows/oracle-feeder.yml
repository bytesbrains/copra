name: Automated Oracle Feeder

# The feeder never posts a default price (#85). A scheduled run needs a declared source in
# COMMODITY_FEED_API_URL (see SOURCES in scripts/oracle_feeder.py; none is declared until #87). Without one,
# the run fails and broadcasts nothing; after the oracle's 7-day heartbeat the price goes stale and mint and
# redeem revert until a real price is posted. That is the intended safe state, not an outage to paper over.

on:
  schedule:
    # Runs every Monday at 06:00 UTC (weekly commodity heartbeat)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      target_price:
        description: 'Manual price override, USD/kg (e.g. 1.45). Testnet only; posted as given and recorded as a manual override, not a sourced price'
        required: false
        default: ''
      force:
        description: 'Re-post an unchanged manual override (refreshes the heartbeat). Needs target_price'
        type: boolean
        required: false
        default: false

concurrency:
  group: oracle-feeder-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  feed:
    name: Update Copra Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ORACLE_FEEDER_KEY lives only in this environment, which only main can deploy to.
    environment: oracle-feeder

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Run Oracle Feeder
        env:
          ORACLE_FEEDER_KEY: ${{ secrets.ORACLE_FEEDER_KEY }}
          BASE_SEPOLIA_RPC: ${{ secrets.BASE_SEPOLIA_RPC || 'https://base-sepolia-rpc.publicnode.com' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          TARGET_PRICE: ${{ github.event.inputs.target_price }}
          COMMODITY_FEED_API_URL: ${{ vars.COMMODITY_FEED_API_URL }}
        run: |
          chmod +x ./scripts/oracle-feeder.sh
          ./scripts/oracle-feeder.sh "$TARGET_PRICE"
